<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자동 저장 웹 계산기</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- 메인 계산기 컨테이너 -->
  <main class="calculator-card">
    <!-- 디스플레이 입력창 -->
    <input type="text" id="display" class="calculator-display" autocomplete="off" />

    <!-- 버튼 그리드 -->
    <div class="buttons-grid">
      <button type="button" class="btn btn-clear" data-action="C">C</button>
      <button type="button" class="btn btn-neutral" data-action="(">(</button>
      <button type="button" class="btn btn-neutral" data-action=")">)</button>
      <button type="button" class="btn btn-operator" data-action="/">/</button>

      <button type="button" class="btn btn-neutral" data-action="7">7</button>
      <button type="button" class="btn btn-neutral" data-action="8">8</button>
      <button type="button" class="btn btn-neutral" data-action="9">9</button>
      <button type="button" class="btn btn-operator" data-action="*">*</button>

      <button type="button" class="btn btn-neutral" data-action="4">4</button>
      <button type="button" class="btn btn-neutral" data-action="5">5</button>
      <button type="button" class="btn btn-neutral" data-action="6">6</button>
      <button type="button" class="btn btn-operator" data-action="-">-</button>

      <button type="button" class="btn btn-neutral" data-action="1">1</button>
      <button type="button" class="btn btn-neutral" data-action="2">2</button>
      <button type="button" class="btn btn-neutral" data-action="3">3</button>
      <button type="button" class="btn btn-operator" data-action="+">+</button>

      <button type="button" class="btn btn-neutral" data-action="0">0</button>
      <button type="button" class="btn btn-neutral" data-action=".">.</button>
      <button type="button" class="btn btn-equal" data-action="=">=</button>

      <button type="button" class="btn btn-neutral" data-action="DEL">DEL</button>
    </div>

    <!-- 기록 관리 버튼 -->
    <button type="button" id="openHistoryBtn" class="btn-history">📜 계산 기록 관리</button>
  </main>

  <!-- 계산 기록 모달 -->
  <div id="historyModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-card">
      <h2 class="modal-title">계산 기록 관리</h2>
      
      <div class="listbox-container">
        <ul id="historyList" class="history-listbox" tabindex="0"></ul>
      </div>

      <div class="modal-btn-row">
        <button type="button" id="useFormulaBtn" class="btn-modal btn-primary">가져오기</button>
        <button type="button" id="deleteSelectedBtn" class="btn-modal btn-danger">선택 삭제</button>
      </div>

      <button type="button" id="clearAllBtn" class="btn-modal btn-warning">기록 전체 삭제</button>
      <button type="button" id="closeHistoryBtn" class="btn-modal btn-secondary">닫기</button>
    </div>
  </div>

  <script src="src/main.js"></script>
</body>
</html>
